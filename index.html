<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>TRADEPRO</title>
<style>
:root{--bg:#0b0b0f;--card:#18181c;--card2:#222227;--tx:#f2f4f8;--mut:#8a8f9c;--g:#2fd36b;--r:#ff5468;--b1:#2b8cff;--b2:#8fc4ff;--p:#b44cf0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color:var(--tx);min-height:100vh;padding:14px;background:radial-gradient(circle at 15% 10%,#2a4fa8,#16306e 40%,#0b1a45 100%) fixed}
.frame{max-width:1400px;margin:0 auto;background:var(--bg);border:6px solid rgba(160,190,255,.35);border-radius:28px;padding:12px}
.hero{border-radius:22px;padding:22px;display:grid;grid-template-columns:1.2fr 1fr;gap:18px;background:radial-gradient(ellipse at 30% 40%,#8fc4ff 0,#3a74d8 35%,#14306f 75%);position:relative}
.top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;letter-spacing:2px}.logo span{color:#fff;text-shadow:0 0 12px #fff}
.live{font-size:12px;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.35);padding:8px 14px;border-radius:20px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--g);animation:pl 1.5s infinite}@keyframes pl{50%{opacity:.3}}
button{font:inherit;color:#fff;background:rgba(255,255,255,.18);border:0;border-radius:14px;padding:8px 14px;cursor:pointer}
.bal small{color:rgba(255,255,255,.75);font-size:13px}.bal h1{font-size:clamp(34px,7vw,64px);font-weight:600;margin-top:4px}.bal h1 i{opacity:.5;font-style:normal}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(12px);border-radius:16px;padding:12px 14px}
.mini small{font-size:11px;color:rgba(255,255,255,.75)}.mini b{display:block;font-size:22px;font-weight:600;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;margin-top:12px}
.card{background:var(--card);border-radius:22px;padding:18px;min-width:0}
.card h3{font-weight:500;font-size:17px;margin-bottom:12px}
.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}.c6{grid-column:span 6}.c12{grid-column:span 12}
.up{color:var(--g)}.dn{color:var(--r)}
.bars{display:flex;align-items:flex-end;gap:8px;height:170px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mut);gap:4px;position:relative}
.bar div{width:100%;border-radius:8px;background:var(--card2);min-height:6px}
.bar.hi div{background:linear-gradient(#2b8cff,#0f2d5c)}
.bar .tip{background:#3a3a40;color:#fff;border-radius:10px;padding:2px 7px;width:auto;min-height:0;font-size:10px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;font-size:12px;color:var(--mut)}.legend b{display:block;color:var(--tx);font-size:16px;font-weight:500}
.sq{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #26262b;font-size:13px}.row small{display:block;color:var(--mut);font-size:11px}
.per{background:var(--card2);border-radius:16px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}.per small{color:var(--mut);display:block;font-size:11px}.per b{font-size:20px;font-weight:500}
.big{font-size:32px;font-weight:500;margin-top:8px}
.btn2{border-radius:16px;background:linear-gradient(135deg,#2b6af0,#3f86ff);padding:14px;text-align:center;font-weight:500;margin-top:8px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
th{color:var(--mut);font-weight:500;text-align:left;padding:9px 10px;border-bottom:1px solid #2c2c32}td{padding:10px;border-bottom:1px solid #212126}
.tag{padding:3px 9px;border-radius:10px;font-size:11px;background:var(--card2)}.tag.up{background:#12301f}.tag.dn{background:#3a1820}
.cap{background:#10294d;color:var(--b2);padding:3px 9px;border-radius:10px}
@media(max-width:900px){.hero{grid-template-columns:1fr}.c5,.c4,.c3,.c6{grid-column:span 12}body{padding:6px}.frame{border-width:3px;padding:8px}}
</style></head><body><div class="frame">
<div class="hero">
 <div class="top"><div class="logo">✱ <span>TRADEPRO</span></div>
 <div style="display:flex;gap:8px;align-items:center"><div class="live"><span class="dot"></span>LIVE · <span id="timestamp">--:--:--</span></div><button onclick="location.reload()">🔄 Refresh</button></div></div>
 <div class="bal"><small>Total P&amp;L (USDT)</small><h1 id="hTotal"></h1><small id="hSub"></small></div>
 <div class="minis" id="minis"></div>
</div>
<div class="grid">
 <div class="card c5"><h3>P&amp;L per Trade</h3><div class="bars" id="bars"></div></div>
 <div class="card c4"><h3>Win / Loss</h3><div id="donut"></div><div class="legend" id="leg"></div></div>
 <div class="card c3"><h3>Performance</h3><div id="periods"></div></div>
 <div class="card c6"><h3>Growth Trajectory</h3><div id="growth"></div><div class="big" id="gBig"></div></div>
 <div class="card c6"><h3>Active Positions</h3><div id="openList"></div></div>
 <div class="card c12"><h3>Closed Trades</h3><div class="tw"><table id="tClosed"></table></div></div>
 <div class="card c12"><h3>Active Positions · Details</h3><div class="tw"><table id="tOpen"></table></div></div>
</div></div>
<script>
    const closedTrades = [
      {
        symbol: 'RARE/USDT #1',
        position: 'SHORT',
        leverage: 10,
        entry: 0.02270,
        exit: 0.01795,
        qty: 8073,
        realCapital: 18.31,
        notional: 183.10,
        pnl: 38.261,
        roi: 209.00,
        duration: '1d 21h',
        status: 'WIN',
        openTime: '28/09 04:44',
        closeTime: '30/09 01:50',
        date: '2026-09-30'
      },
      {
        symbol: 'INX/USDT',
        position: 'LONG',
        leverage: 10,
        entry: 0.5742,
        exit: 0.7360,
        qty: 333,
        realCapital: 25.00,
        notional: 250.00,
        pnl: 53.866,
        roi: 215.41,
        duration: '4d 21h',
        status: 'WIN',
        openTime: '23/09 01:08',
        closeTime: '27/09 22:48',
        date: '2026-09-27'
      },
      {
        symbol: 'RARE/USDT #2',
        position: 'SHORT',
        leverage: 10,
        entry: 0.02250,
        exit: 0.02416,
        qty: 5994,
        realCapital: 13.487,
        notional: 134.87,
        pnl: -9.939,
        roi: -73.71,
        duration: '16h',
        status: 'LOSS',
        openTime: '27/09 12:41',
        closeTime: '28/09 04:34',
        date: '2026-09-28'
      },
      {
        symbol: 'WLD/USDT',
        position: 'LONG',
        leverage: 10,
        entry: 0.56,
        exit: 0.55,
        qty: 197,
        realCapital: 11.02,
        notional: 110.2,
        pnl: -2.163,
        roi: -19.63,
        duration: '1h 15m',
        status: 'LOSS',
        openTime: '28/09 01:51',
        closeTime: '28/09 03:06',
        date: '2026-09-28'
      },
      {
        symbol: 'ENA/USDT',
        position: 'LONG',
        leverage: 10,
        entry: 0.29,
        exit: 0.28,
        qty: 428,
        realCapital: 12.43,
        notional: 124.3,
        pnl: -3.496,
        roi: -28.1,
        duration: '1h 28m',
        status: 'LOSS',
        openTime: '28/09 01:38',
        closeTime: '28/09 03:06',
        date: '2026-09-28'
      }
    ];

    const openTrades = [
      {
        symbol: 'RECALL/USDT',
        position: 'LONG',
        leverage: 10,
        entry: 0.04714,
        current: 0.04892,
        liqPrice: 0.04322,
        target: 0.08000,
        qty: 6662,
        realMargin: 30.821,
        size: 325.905,
        pnl: 11.885,
        roe: 38.56,
        status: 'OPEN',
        openTime: '30/09',
        date: '2026-09-30'
      },
      {
        symbol: 'STBL/USDT',
        position: 'LONG',
        leverage: 10,
        entry: 0.02676,
        current: 0.02652,
        liqPrice: 0.0245,
        target: 0.05300,
        qty: 10103,
        realMargin: 26.922,
        size: 267.932,
        pnl: -2.420,
        roe: -8.99,
        status: 'OPEN',
        openTime: '01/10',
        date: '2026-10-01'
      },
      {
        symbol: 'YB/USDT',
        position: 'LONG',
        leverage: 5,
        entry: 0.08701,
        current: 0.08536,
        liqPrice: 0.0709,
        target: 0.40000,
        qty: 1208,
        realMargin: 21.045,
        size: 103.115,
        pnl: -1.993,
        roe: -9.47,
        status: 'OPEN',
        openTime: '01/10 12:03',
        date: '2026-10-01'
      },
      {
        symbol: 'SIREN/USDT',
        position: 'LONG',
        leverage: 7,
        entry: 0.02310,
        current: 0.02317,
        liqPrice: 0.02014,
        target: 0.03000,
        qty: 4652,
        realMargin: 15.390,
        size: 107.787,
        pnl: 0.326,
        roe: 2.12,
        status: 'OPEN',
        openTime: '01/10 04:45',
        date: '2026-10-01'
      }
    ];
const f=(n,d=3)=>(n>=0?'+':'')+n.toFixed(d),cl=n=>n>=0?'up':'dn',sum=(a,k)=>a.reduce((s,t)=>s+t[k],0);
setInterval(()=>document.getElementById('timestamp').textContent=new Date().toLocaleTimeString('en-GB'),1000);
const $=id=>document.getElementById(id);
const cP=sum(closedTrades,'pnl'),oP=sum(openTrades,'pnl'),tot=cP+oP,cap=sum(closedTrades,'realCapital')+sum(openTrades,'realMargin');
const wins=closedTrades.filter(t=>t.pnl>0).length,losses=closedTrades.length-wins,wr=Math.round(wins/closedTrades.length*100);
const [ti,td]=tot.toFixed(2).split('.');
$('hTotal').innerHTML=(tot>=0?'+':'')+ti+'<i>.'+td+'</i>';
$('hSub').textContent=`${closedTrades.length+openTrades.length} positions · ${openTrades.length} active`;
$('minis').innerHTML=[['Win Rate',wr+'%'],['Closed P&L',f(cP,2)],['Open P&L',f(oP,2)],['Total Capital',cap.toFixed(2)]].map(([a,b])=>`<div class="mini"><small>${a}</small><b>${b}</b></div>`).join('');
const mx=Math.max(...closedTrades.map(t=>Math.abs(t.pnl)));
$('bars').innerHTML=closedTrades.map((t,i)=>`<div class="bar ${i==0?'hi':''}">${i==0?`<span class="tip">${f(t.pnl,1)}</span>`:''}<div style="height:${Math.max(8,Math.abs(t.pnl)/mx*130)}px;${t.pnl<0?'background:#3a1820':''}"></div>${t.symbol.split('/')[0].slice(0,5)}</div>`).join('');
const R=80,C=Math.PI*R,wl=wins/closedTrades.length*C;
$('donut').innerHTML=`<svg viewBox="0 0 200 110" width="100%"><defs><linearGradient id="gd"><stop offset="0" stop-color="#e45cff"/><stop offset="1" stop-color="#8a2be2"/></linearGradient></defs><path d="M20 100A80 80 0 0 1 180 100" fill="none" stroke="#3a3a40" stroke-width="22" stroke-linecap="round"/><path d="M20 100A80 80 0 0 1 180 100" fill="none" stroke="url(#gd)" stroke-width="22" stroke-linecap="round" stroke-dasharray="${wl} ${C}"/><text x="100" y="98" text-anchor="middle" fill="#fff" font-size="26">${wr}%</text></svg>`;
$('leg').innerHTML=`<div><span class="sq" style="background:#e45cff"></span>Wins<b>${wins}</b></div><div><span class="sq" style="background:#3a3a40"></span>Losses<b>${losses}</b></div><div><span class="sq" style="background:#6b7cff"></span>Active<b>${openTrades.length}</b></div><div><span class="sq" style="background:#2fd5a0"></span>Total Capital<b>${cap.toFixed(1)}</b></div>`;
const now=new Date('2026-10-01'),pd=t=>new Date(t.date);
const per=(n,fn)=>{const a=closedTrades.filter(fn);return `<div class="per"><div><small>${n}</small><b class="${cl(sum(a,'pnl'))}">${f(sum(a,'pnl'),2)}</b></div><small>${a.length} trades</small></div>`};
$('periods').innerHTML=per('Weekly',t=>(now-pd(t))/864e5<=7)+per('Monthly',t=>pd(t).getMonth()==now.getMonth())+per('Yearly',t=>pd(t).getFullYear()==now.getFullYear());
let run=0;const pts=[0,...[...closedTrades].reverse().map(t=>run+=t.pnl)],gm=Math.max(...pts)||1,gn=Math.min(...pts);
const xy=pts.map((v,i)=>[i/(pts.length-1)*400,90-(v-gn)/(gm-gn||1)*80]);
const ln=xy.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
$('growth').innerHTML=`<svg viewBox="0 0 400 100" width="100%" preserveAspectRatio="none" style="height:110px"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fd36b" stop-opacity=".35"/><stop offset="1" stop-color="#2fd36b" stop-opacity="0"/></linearGradient></defs><path d="${ln} L400 100 L0 100Z" fill="url(#ga)"/><path d="${ln}" fill="none" stroke="#2fd36b" stroke-width="2"/></svg>`;
$('gBig').innerHTML=`<span class="up">${f(cP,2)}</span> <small style="font-size:13px;color:var(--mut)">USDT closed</small>`;
$('openList').innerHTML=openTrades.map(t=>`<div class="row"><div><b>${t.symbol}</b><small>${t.position} ${t.leverage}x · Entry ${t.entry}</small></div><div style="text-align:right"><b class="${cl(t.pnl)}">${f(t.pnl)}</b><small class="${cl(t.roe)}">${f(t.roe,2)}%</small></div></div>`).join('');
$('tClosed').innerHTML='<tr><th>Symbol<th>Pos<th>Lev<th>Capital<th>Profit/Loss<th>Entry<th>Exit<th>Notional<th>Qty<th>ROI<th>Status<th>Open<th>Close<th>Duration</tr>'+closedTrades.map(t=>`<tr><td><b>${t.symbol}</b><td>${t.position}<td>${t.leverage}x<td><span class="cap">${t.realCapital.toFixed(2)}</span><td><span class="tag ${cl(t.pnl)}">${f(t.pnl)}</span><td>${t.entry}<td>${t.exit}<td>${t.notional.toFixed(2)}<td>${t.qty}<td class="${cl(t.roi)}">${f(t.roi,2)}%<td><span class="tag ${t.pnl>0?'up':'dn'}">${t.pnl>0?'WIN':'LOSS'}</span><td>${t.openTime}<td>${t.closeTime}<td>${t.duration}</tr>`).join('');
$('tOpen').innerHTML='<tr><th>Symbol<th>Pos<th>Lev<th>Entry<th>Current<th>Margin<th>Size<th>Qty<th>Liq.<th>Target<th>P&L<th>ROE<th>Open</tr>'+openTrades.map(t=>`<tr><td><b>${t.symbol}</b><td>${t.position}<td>${t.leverage}x<td>${t.entry}<td>${t.current}<td><span class="cap">${t.realMargin.toFixed(3)}</span><td>${t.size}<td>${t.qty}<td>${t.liqPrice}<td>${t.target}<td class="${cl(t.pnl)}">${f(t.pnl)}<td class="${cl(t.roe)}">${f(t.roe,2)}%<td>${t.openTime}</tr>`).join('');
</script></body></html>
